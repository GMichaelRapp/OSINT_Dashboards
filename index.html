<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Build sourced dashboards from CSV data with OSINT Style Guide citations. One file, no server.">
<title>OSINT Dashboard Builder</title>
<script id="theme-early">(function () { try { var t = localStorage.getItem('osint-dashboard-theme-v1'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {} })();</script>
<style>
/* Layout: app bar with View/Edit; View = section tabs over a 3-column panel grid, sources under each panel, disputes and gaps at the foot; Edit = list/form split panes. Tokens follow the OSINT Citation Generator family; series colors are the validated dataviz reference palette. */
:root {
  --bg: #EEF2F5; --surface: #FFFFFF; --sheet: #F7F9FB; --ink: #13222C; --muted: #566977; --faint: #8796A2; --line: #CCD6DE;
  --accent: #0F4761; --accent-ink: #FFFFFF; --accent-soft: #DFEBF1; --hi: #FFF4CC;
  --z-green: #C6E0B4; --z-yellow: #FFE699; --z-orange: #F8CBAD; --z-red: #FF9999; --z-gray: #D9D9D9; --z-ink: #1B242B;
  --fix: #9E2219; --fix-bg: #FBE3E0; --check: #6F4B00; --check-bg: #FBEDC4; --ok: #2A6637;
  --font-ui: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-read: 'Iowan Old Style', 'Charter', 'Bitstream Charter', 'Sitka Text', Cambria, Georgia, 'Times New Roman', serif;
  --font-mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D151B; --surface: #152029; --sheet: #1A2630; --ink: #E3EAEF; --muted: #94A6B3; --faint: #6C7D89; --line: #2C3B46;
  --accent: #8CC4DD; --accent-ink: #0B1A22; --accent-soft: #1C323E; --hi: #3A3216;
  --z-green: #35603A; --z-yellow: #7A6520; --z-orange: #8A5330; --z-red: #8A3636; --z-gray: #46525B; --z-ink: #F1F5F7;
  --fix: #FFA79C; --fix-bg: #3F1D1A; --check: #F2CD6B; --check-bg: #3A2E10; --ok: #8FD19E; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0D151B; --surface: #152029; --sheet: #1A2630; --ink: #E3EAEF; --muted: #94A6B3; --faint: #6C7D89; --line: #2C3B46;
  --accent: #8CC4DD; --accent-ink: #0B1A22; --accent-soft: #1C323E; --hi: #3A3216;
  --z-green: #35603A; --z-yellow: #7A6520; --z-orange: #8A5330; --z-red: #8A3636; --z-gray: #46525B; --z-ink: #F1F5F7;
  --fix: #FFA79C; --fix-bg: #3F1D1A; --check: #F2CD6B; --check-bg: #3A2E10; --ok: #8FD19E; color-scheme: dark; }
* { box-sizing: border-box }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px) }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font-ui) }
a { color: var(--accent) }
button, input, select, textarea { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.wrap { max-width: 1200px; margin: 0 auto }
code { font-family: var(--font-mono); font-size: .92em }
[hidden] { display: none !important }

/* app bar */
.appbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line) }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface) }
.appbar .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding-block: 8px }
.brand { font-weight: 700; font-size: 14px; letter-spacing: .01em; display: flex; align-items: center; gap: 8px; white-space: nowrap }
.brand svg { flex: none }
.brand small { font-weight: 400; color: var(--muted) }
.tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden }
.tabs button { border: 0; background: transparent; padding: 5px 14px; cursor: pointer; font-weight: 500; font-size: 13.5px }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink) }
.spacer { flex: 1 }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 5px 11px; border-radius: 6px; cursor: pointer; font-size: 13.5px; font-weight: 500; white-space: nowrap }
.btn:hover { border-color: var(--accent) }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
.btn.danger { color: var(--fix); border-color: var(--fix) }
.btn.small { padding: 3px 8px; font-size: 12.5px }
.btn.link { border: 0; background: none; color: var(--accent); padding: 2px 4px; text-decoration: underline; text-underline-offset: 2px }
.menu { position: relative }
.menu > summary { list-style: none }
.menu > summary::-webkit-details-marker { display: none }
.menu-pop { position: absolute; right: 0; top: calc(100% + 6px); min-width: 270px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.18); padding: 6px; display: grid; z-index: 40 }
.menu-pop button { text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 5px; cursor: pointer; font-size: 13.5px }
.menu-pop button:hover { background: var(--accent-soft) }
.menu-pop small { display: block; color: var(--muted); font-size: 12px }
.menu-pop hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0 }
.status { font-size: 12px; color: var(--muted); white-space: nowrap }
select.theme { font-size: 12.5px; padding: 3px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface) }

/* ---------- series palette (dataviz reference palette; validated light on #FFFFFF, dark on #152029) ---------- */
:root { --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #008300; --c7: #6250d6; --c8: #e34948; --cx: #9AA6B0;
  --grid: #E3E8EC; --axis: #B9C4CC; --ring: var(--surface) }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767; --cx: #66757F; --grid: #24323C; --axis: #3A4A55 } }
:root[data-theme="dark"] { --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767; --cx: #66757F; --grid: #24323C; --axis: #3A4A55 }

/* ---------- VIEW ---------- */
.v-head { padding-block: 34px 10px; display: grid; gap: 10px }
.vh-text { display: grid; gap: 10px; min-width: 0 }
.pv.al-center .vh-text { justify-items: center; text-align: center }
/* the header picture: above the title, beside it, or behind it */
.cover { margin: 22px 0 0; display: grid; gap: 6px }
.cover img { width: 100%; display: block; object-fit: cover; border-radius: 10px; background: var(--sheet) }
.cover figcaption, .cover-cap { font-size: 12px; color: var(--muted) }
.cover-above.ch-S img { height: clamp(140px, 20vw, 220px) } .cover-above.ch-M img { height: clamp(180px, 30vw, 360px) } .cover-above.ch-L img { height: clamp(220px, 42vw, 520px) }
.v-head.has-side { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); align-items: center; gap: 28px }
.cover-side { margin: 0 } .cover-side.ch-S img { aspect-ratio: 16 / 9 } .cover-side.ch-M img { aspect-ratio: 4 / 3 } .cover-side.ch-L img { aspect-ratio: 1 / 1 }
@media (max-width: 760px) { .v-head.has-side { grid-template-columns: minmax(0, 1fr) } }
.v-head.has-bg { position: relative; margin-top: 18px; padding: 40px 28px 22px; border-radius: 12px; overflow: hidden; color: #fff; align-content: end; isolation: isolate }
.v-head.has-bg.ch-S { min-height: 220px } .v-head.has-bg.ch-M { min-height: 320px } .v-head.has-bg.ch-L { min-height: 460px }
.cover-bg { position: absolute; inset: 0; z-index: -1; background: #111 }
.cover-bg img { width: 100%; height: 100%; object-fit: cover; display: block }
.cover-bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(6,12,18,.15) 0%, rgba(6,12,18,.55) 55%, rgba(6,12,18,.86) 100%) }
.v-head.has-bg .eyebrow, .v-head.has-bg .dek, .v-head.has-bg .meta, .v-head.has-bg .meta b { color: rgba(255,255,255,.88) }
.v-head.has-bg .dek a { color: #fff }
.v-head.has-bg .cover-cap { position: absolute; right: 12px; bottom: 8px; color: rgba(255,255,255,.75); font-size: 11px; max-width: 60%; text-align: right }
.v-head.has-bg .vh-text { padding-bottom: 14px }
/* sections on one long page */
.vsec { scroll-margin-top: calc(var(--appbar-h, 46px) + 64px); padding-top: 18px }
.vsec + .vsec { border-top: 1px solid var(--line); margin-top: 8px }
.sec-h { font-family: var(--font-read); font-size: clamp(22px, 2.6vw, 30px); font-weight: 600; margin: 8px 0 0; letter-spacing: -.01em }
.pv.hf-sans .sec-h { font-family: var(--font-ui); font-weight: 700 }
.stabs button[aria-current="true"] { background: var(--surface); border-color: var(--line); color: var(--ink) }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted) }
.v-title { font-family: var(--font-read); font-weight: 600; font-size: clamp(32px, 5vw, 50px); line-height: 1.05; margin: 0; text-wrap: balance; letter-spacing: -.01em }
.dek { max-width: 70ch; color: var(--muted); font-size: 16px; margin: 0 }
.meta { display: flex; flex-wrap: wrap; gap: 6px 18px; font-family: var(--font-mono); font-size: 12.5px; color: var(--muted) }
.meta b { color: var(--ink); font-weight: 600 }
.stabs { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--appbar-h, 46px)); z-index: 10; background: var(--bg); display: flex; flex-wrap: wrap; gap: 4px; padding-block: 10px; border-bottom: 1px solid var(--line); margin-top: 8px }
.stabs button { border: 1px solid transparent; background: none; padding: 6px 14px; border-radius: 999px; cursor: pointer; font-weight: 500; font-size: 14px; color: var(--muted) }
.stabs button[aria-selected="true"] { background: var(--surface); border-color: var(--line); color: var(--ink) }
.sec-desc { color: var(--muted); font-size: 14px; margin: 14px 0 0 }
/* panels sit in a twelve-part grid: a sixth, a quarter, a third, half, two thirds, three quarters, five sixths or the full row */
.pgrid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; padding-block: 16px 24px; align-items: start; grid-auto-flow: row dense }
.pv.flow-order .pgrid { grid-auto-flow: row }
.pgrid > .s2 { grid-column: span 2 } .pgrid > .s3 { grid-column: span 3 } .pgrid > .s4 { grid-column: span 4 } .pgrid > .s6 { grid-column: span 6 } .pgrid > .s8 { grid-column: span 8 } .pgrid > .s9 { grid-column: span 9 } .pgrid > .s10 { grid-column: span 10 } .pgrid > .s12, .pgrid > .lay-end { grid-column: 1 / -1 }
.pgrid > .r2 { grid-row: span 2 } .pgrid > .r3 { grid-row: span 3 }
.pgrid > .r2, .pgrid > .r3 { align-self: stretch }
@media (max-width: 980px) { .pgrid > .s2, .pgrid > .s3 { grid-column: span 4 } .pgrid > .s4 { grid-column: span 6 } .pgrid > .s8, .pgrid > .s9, .pgrid > .s10 { grid-column: 1 / -1 } }
@media (max-width: 620px) { .pgrid { grid-template-columns: minmax(0, 1fr) } .pgrid > * { grid-column: 1 / -1 !important; grid-row: auto !important } }
/* a panel's own frame, over the page's choice */
.pgrid > .panel.fr-card { background: var(--surface); border: 1px solid var(--line); box-shadow: none; border-radius: 10px; padding: 16px }
.pgrid > .panel.fr-shadow { background: var(--surface); border: 1px solid transparent; box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 6px 18px rgba(0,0,0,.08); border-radius: 10px; padding: 16px }
.pgrid > .panel.fr-flat { background: transparent; border: 0; border-top: 2px solid var(--line); box-shadow: none; border-radius: 0; padding: 6px 2px 10px }
.pgrid > .panel.fr-tint { background: var(--accent-soft); border: 1px solid transparent; box-shadow: none; border-radius: 10px; padding: 16px }
.pgrid > .panel.fr-none { background: transparent; border: 0; box-shadow: none; border-radius: 0; padding: 0 }
.pgrid > .panel.fr-none .p-foot { border-top-color: transparent; padding-top: 2px }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; display: grid; gap: 10px; scroll-margin-top: 140px }
.panel.flash { outline: 3px solid var(--accent) }
.p-head { display: grid; gap: 2px }
.p-title { font-size: 15px; font-weight: 600; margin: 0; line-height: 1.3 }
.p-sub { font-size: 12.5px; color: var(--muted); margin: 0 }
.p-body { min-width: 0; position: relative }
.p-foot { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; font-size: 12.5px; border-top: 1px solid var(--line); padding-top: 8px }
.p-foot .sp { flex: 1 }
.p-foot button.lk { border: 0; background: none; padding: 0; color: var(--accent); cursor: pointer; font-size: 12.5px }
.p-foot .disp { color: var(--check); font-weight: 600 }
.p-foot .pid { font-family: var(--font-mono); font-size: 10.5px; color: var(--faint) }
.p-note { font-size: 12.5px; color: var(--muted); margin: 0 }
.p-src { display: grid; gap: 8px }
.cite { background: var(--sheet); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; min-width: 0 }
.fn { font-family: var(--font-read); font-size: 14px; line-height: 1.45; overflow-wrap: anywhere }
.fn a { overflow-wrap: anywhere }
.cite blockquote { margin: 6px 0 0; font-family: var(--font-read); font-style: italic; font-size: 13.5px; border-left: 2px solid var(--line); padding-left: 9px; overflow-wrap: anywhere }
.cite .cnote, .cite .uses { font-size: 12px; color: var(--muted); margin-top: 4px }
.rate { font-family: var(--font-mono); font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 3px; background: var(--zc); color: var(--z-ink) }
/* stat */
.stat-v { font-size: clamp(30px, 4vw, 40px); font-weight: 650; letter-spacing: -.01em; line-height: 1.05; overflow-wrap: anywhere }
.stat-c { font-size: 13px; color: var(--muted) }
/* charts */
.chart { display: block; width: 100%; height: auto; overflow: visible }
.chart.map { overflow: hidden; border-radius: 6px }
.chart text { font-family: var(--font-ui); font-size: 11px; fill: var(--muted) }
.chart .tick text, .chart .ax { font-variant-numeric: tabular-nums }
.chart .lbl { fill: var(--ink); font-size: 11.5px }
.chart .val { fill: var(--ink); font-size: 11px; font-variant-numeric: tabular-nums }
.chart .gl { stroke: var(--grid); stroke-width: 1 }
.chart .bl { stroke: var(--axis); stroke-width: 1 }
.chart .hit { fill: transparent; cursor: default }
.chart .hit:hover + .mark, .chart .mark:hover { filter: brightness(1.12) }
.chart .xh { stroke: var(--muted); stroke-width: 1; pointer-events: none }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--ink) }
.legend span { display: inline-flex; align-items: center; gap: 6px }
.legend i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; background: var(--k) }
.legend i.dot { width: 10px; height: 10px; border-radius: 50% }
.tip { position: fixed; z-index: 70; pointer-events: none; background: var(--ink); color: var(--bg); border-radius: 6px; padding: 7px 10px; font-size: 12.5px; max-width: 320px; box-shadow: 0 6px 20px rgba(0,0,0,.2); white-space: pre-line; line-height: 1.4 }
.tip b { font-size: 14px }
.tip .row { display: flex; gap: 8px; align-items: center }
.tip .row i { width: 10px; height: 2px; background: var(--k); display: inline-block; flex: none }
/* tables */
.tbl-wrap { overflow-x: auto; max-width: 100% }
table.dt { border-collapse: collapse; width: 100%; font-size: 13px }
table.dt th { text-align: left; font-weight: 600; font-size: 12px; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; cursor: pointer; user-select: none }
table.dt th[aria-sort="ascending"]::after { content: " ▲"; font-size: 9px } table.dt th[aria-sort="descending"]::after { content: " ▼"; font-size: 9px }
table.dt td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: break-word }
table.dt td.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap }
table.dt th.n { text-align: right }
table.dt td.src { font-size: 12px; color: var(--muted); min-width: 110px }
.tbl-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px }
.tbl-bar input { flex: 1 1 160px; min-width: 0; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--sheet) }
.tbl-bar .pg { font-size: 12px; color: var(--muted); font-family: var(--font-mono); display: flex; gap: 6px; align-items: center }
/* map */
.map .land { fill: var(--grid); stroke: none }
.map .borders { fill: none; stroke: var(--surface); stroke-width: .6; vector-effect: non-scaling-stroke }
.map .ocean { fill: var(--surface) }
.map .pt { stroke: var(--surface); stroke-width: 2 }
.map text.pl { fill: var(--ink); font-size: 11px; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round }
/* timeline panel */
.tl { display: grid; gap: 10px }
.tl-list { max-height: 520px; overflow: auto; border-top: 1px solid var(--line) }
.tl-ev { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 2px 12px; padding: 9px 0 9px 12px; border-bottom: 1px solid var(--line); position: relative }
.tl-ev::before { content: ""; position: absolute; left: 0; top: 15px; width: 7px; height: 7px; border-radius: 50%; background: var(--k) }
.tl-ev .d { font-family: var(--font-mono); font-size: 12px; color: var(--muted) }
.tl-ev .t { font-family: var(--font-read); font-size: 15px; line-height: 1.4; margin: 0 }
.tl-ev .m { font-size: 12px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap }
.tl-ev details summary { cursor: pointer; color: var(--accent); font-size: 12px }
@media (max-width: 560px) { .tl-ev { grid-template-columns: minmax(0, 1fr) } }
/* text panel */
.prose { font-family: var(--font-read); font-size: 15.5px; line-height: 1.55; max-width: 72ch }
.prose p { margin: 0 0 10px }
/* foot */
.v-foot { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; padding-block: 8px 30px }
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px }
.box h3 { font-family: var(--font-read); font-size: 19px; margin: 0 0 4px }
.box .sub { font-size: 12.5px; color: var(--muted); margin: 0 0 8px }
.box details { border-top: 1px solid var(--line); padding: 8px 0 } .box details summary { cursor: pointer; font-weight: 500; font-size: 13.5px }
.box details p { font-size: 13px; margin: 6px 0 }
.box ul { margin: 0; padding-left: 18px; font-size: 13px; display: grid; gap: 7px }
.refs { display: flex; flex-wrap: wrap; gap: 4px }
.refs button { font: 11px var(--font-mono); padding: 2px 6px; border: 1px solid var(--line); border-radius: 3px; background: transparent; color: var(--accent); cursor: pointer }
.zgrid { display: grid; grid-template-columns: auto repeat(6, 1fr); gap: 2px; font: 10.5px var(--font-mono); margin-top: 6px }
.zgrid span { text-align: center; padding: 2px 0; border-radius: 2px; color: var(--z-ink) } .zgrid .h { color: var(--muted) }
.foot { padding-block: 24px 40px; color: var(--muted); font-size: 12.5px; border-top: 1px solid var(--line) }
.empty { padding: 40px 0; color: var(--muted) }
.hintbox { font-size: 13px; color: var(--muted); padding: 14px; border: 1px dashed var(--line); border-radius: 8px }
@media print { .appbar, .stabs { display: none } .panel { break-inside: avoid } }
/* ---------- EDIT ---------- */
.etabs { display: flex; flex-wrap: wrap; gap: 4px; padding-block: 14px 10px; border-bottom: 1px solid var(--line) }
.etabs button { border: 0; background: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 14px; color: var(--muted) }
.etabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--ink) }
.etabs .n { font-family: var(--font-mono); font-size: 11.5px; color: var(--faint); margin-left: 3px }
.split { display: grid; grid-template-columns: minmax(260px, 380px) minmax(0, 1fr); gap: 20px; padding-block: 16px 60px; align-items: start }
@media (max-width: 860px) { .split { grid-template-columns: minmax(0, 1fr) } }
.listcol { display: grid; gap: 8px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--appbar-h, 46px) + 10px); max-height: calc(100vh - 90px); min-width: 0 }
@media (max-width: 860px) { .listcol { position: static; max-height: 46vh } }
.list { overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); min-height: 120px }

e":"Some amounts are approximate in the record (\"about\", \"over\", \"a little over\"). Dollar values are left out because they depend on the date of each transfer."},{"id":"d3","name":"Sentences","desc":"Prison sentences in the Silk Road prosecutions, as stated in the record.","columns":[{"key":"person","label":"Person","type":"text"},{"key":"role","label":"Role","type":"text"},{"key":"sentence","label":"Sentence","type":"text"},{"key":"months","label":"Months","type":"number"},{"key":"date","label":"Imposed","type":"date"},{"key":"source_id","label":"Source","type":"source"},{"key":"locator","label":"Locator","type":"locator"},{"key":"quote","label":"Quote","type":"quote"}],"rows":[["Ross Ulbricht","Silk Road operator (\"Dread Pirate Roberts\")","Life",null,"2015-05-29","s12","p. 1, 3 (Judgment, ECF 269)","Counts Two (2) and Four (4): Life to run concurrently; Count (5): Five (5) Years to run concurrently"],["Carl Mark Force IV","Former DEA special agent","78 months",78,"","s1","p. 11 (App. 9a) n.6","Force was sentenced to 78 months in prison, and Bridges received a 71-month sentence."],["Shaun W. Bridges","Former Secret Service special agent","71 months",71,"2015-12","s7","p. 1","In December 2015, Bridges was sentenced to 71 months in prison on those charges."],["Shaun W. Bridges","Former Secret Service special agent (second case)","24 months, consecutive",24,"2017-11-07","s8","p. 1","Shaun W. Bridges, 35, of Laurel, Maryland, was sentenced to 24 months in prison"]],"cites":[],"note":"The folder holds no record of the date Force was sentenced; the figure comes from the Second Circuit's summary."},{"id":"d4","name":"Places in the case","desc":"Where key steps in the investigation and prosecution happened.","columns":[{"key":"place","label":"Place","type":"text"},{"key":"lat","label":"Latitude","type":"lat"},{"key":"lon","label":"Longitude","type":"lon"},{"key":"kind","label":"Kind","type":"text"},{"key":"what","label":"What happened","type":"text"},{"key":"date","label":"Date","type":"date"},{"key":"event","label":"Timeline entry","type":"text"},{"key":"source_id","label":"Source","type":"source"},{"key":"locator","label":"Locator","type":"locator"},{"key":"quote","label":"Quote","type":"quote"}],"rows":[["Chicago (O'Hare mail facility)",41.98,-87.9,"Investigation","HSI Chicago begins tracking Silk Road drug envelopes","2011-06","D002","s42","p. 2 (3505-00295)","-June of 2011, HSI Chicago started monitoring unusual drugs seizures from the Mail Branch related to the Silk Road"],["Baltimore",39.29,-76.61,"Investigation","HSI Baltimore forms a multi-agency task force","2012-03-27","D008","s42","p. 3 (3505-00296)","SA McFarland also created an unofficial task force comprised of multiple agencies to include DEA, Postal Inspectors, IRS and Secret Service."],["Reykjavik, Iceland",64.15,-21.94,"Arrest and seizure","Icelandic police image the Silk Road server","2013-07-23","A043","s49","p. 6 ¶12","After obtaining the necessary court order under Icelandic law, the RMP imaged the Subject Server on July 23, 2013."],["Conshohocken, Pennsylvania",40.08,-75.3,"Arrest and seizure","FBI warrant for the backup server","2013-09-09","A050","s49","p. 8 ¶16","The FBI obtained a search warrant for this backup server (the “Primary Backup Server”) on September 9, 2013."],["San Francisco (Glen Park)",37.73,-122.43,"Arrest and seizure","Ulbricht arrested in a public library","2013-10-01","A059","s1","p. 14 (App. 12a)","Ulbricht was arrested in a San Francisco public library on October 1, 2013"],["Monroe, New York",41.33,-74.19,"Arrest and seizure","Vendor Michael Duch arrested at a post office","2013-10","C066","s31","p. 173, Tr. 1489:12-17","I was arrested in October of 2013. Q. Where were you arrested? A. Outside of a post office in Monroe, New York."],["New York (S.D.N.Y.)",40.71,-74,"Courts","Trial of Ross Ulbricht","2015-01-13","A091","s1","p. 15 (App. 13a)","Ulbricht’s trial lasted approximately three weeks, from January 13 through February 4, 2015."],["San Francisco (N.D. Cal.)",37.79,-122.4,"Courts","Force and Bridges charged","2015-03-25","A098","s15","p. 35 (Br. 18)","on March 25, 2015, seven weeks after trial concluded in this case, the government filed criminal charges against Force and another participant in the Silk Road investigation"]],"cites":[],"note":"Coordinates are approximate, city-level positions added by the compiler. They are not from the sources."}],"timelines":[{"id":"t1","name":"Headline events","threads":[{"id":"market","name":"Silk Road & DPR","desc":"What the site and its operator did, as shown in the evidence","color":"violet"},{"id":"investigation","name":"Investigation","desc":"Federal investigative steps before the arrest","color":"blue"},{"id":"rogue","name":"Rogue agents","desc":"Force (DEA) and Bridges (USSS) of the Baltimore task force","color":"red"},{"id":"takedown","name":"Arrest & takedown","desc":"Sept 26 – Oct 3, 2013","color":"green"},{"id":"court","name":"Pretrial","desc":"Charging, motions, and the sealed Force litigation","color":"slate"},{"id":"trial","name":"Trial","desc":"Jan 13 – Feb 4, 2015","color":"amber"},{"id":"after","name":"Sentencing & after","desc":"Post-trial motions, sentence, appeals, clemency","color":"plum"}],"events":[{"id":"C004","date":"2011-01-27","end":"","prec":"exact","thread":"market","key":true,"text":"Testimony of SA Gary Alford: user \"Altoid\" registered on shroomery.org on January 27, 2011 and posted that day pointing readers to SilkRoad420.wordpress.com; the shroomery registration email went to RossUlbricht@gmail.com.","actors":"SA Gary Alford; \"Altoid\"","cites":[{"src":"s29","loc":"p. 47, Tr. 1272:13-16","quote":"shroomery message board account has been created. Date is 1/27/2011, 6:22 p.m.","note":""}],"notes":"GX 304, 305, 308-A. Shroomery post date (January 27, 2011) at Tr. 1261:25-1262:1; registration and post same day at Tr. 1263:4-10."},{"id":"C007","date":"2011-02-06","end":"","prec":"range","thread":"market","key":true,"text":"Testimony of Brian Shaw: Silk Road's transaction database covered February 6, 2011 through October 2, 2013, with 1,530,252 transactions worth 9,912,070.05 bitcoins (about $213.9 million at recorded values) and commissions of 642,455.36 bitcoins (about $13.2 million).","actors":"Brian Shaw (FBI contractor)","cites":[{"src":"s32","loc":"pp. 82-84, Tr. 1924:23-1926:7","quote":"it covered February 6, 2011 through October 2, 2013, so the entirety of what was in the database.","note":""}],"notes":"Range end 2013-10-02. Totals at Tr. 1926:1-7. The earliest transaction is February 6, 2011, consistent with the government's \"February of 2011\" start (Doc 210, Tr. 1255:1-3); the defense pointed to \"June 18, 2011\" as the start of the site's \"current form\" (Doc 214, Tr. 1406:24-1407:1)."},{"id":"D002","date":"2011-06","end":"","prec":"month","thread":"investigation","key":true,"text":"HSI Chicago began monitoring unusual drug seizures at the O'Hare international mail branch linked to Silk Road (per HSI Chicago chronology in SA Der-Yeghiayan 3500 material).","actors":"HSI Chicago","cites":[{"src":"s42","loc":"p. 2 (3505-00295)","quote":"-June of 2011, HSI Chicago started monitoring unusual drugs seizures from the Mail Branch related to the Silk Road","note":""},{"src":"s23","loc":"p. 62; Tr. 76:17-76:25","quote":"This is approximately June 2011. An officer brought to my attention several --","note":""}],"notes":"Defense reply exhibit (ECF 232-6), an HSI Chicago internal chronology; author perspective is HSI Chicago."},{"id":"D003","date":"2011-10-13","end":"","prec":"exact","thread":"investigation","key":true,"text":"HSI Chicago opened case \"Operation Dime Store\" to document Silk Road-linked mail seizures.","actors":"HSI Chicago","cites":[{"src":"s42","loc":"p. 2 (3505-00295)","quote":"On October 13, 2011, HSI Chicago opened case Operation Dime Store to document the findings of the seizures coming into the mail branch.","note":""},{"src":"s23","loc":"p. 60; Tr. 74:3-74:4","quote":"Q. When was that? A. It was October 2011.","note":""}],"notes":"He first heard of the site approx. late Sept/early Oct 2011 (Tr. 88:1). Bitcoin ~$2-4 then (198 Tr. 153:21-22)."},{"id":"A010","date":"2012-01","end":"","prec":"approx","thread":"market","key":true,"text":"Around January 2012 Silk Road's lead administrator adopted the username Dread Pirate Roberts; DPR signed posts with a PGP key whose private key was later found on Ulbricht's laptop.","actors":"DPR","cites":[{"src":"s1","loc":"p. 16 (App. 14a)","quote":"Around January 2012, the Silk Road user who represented himself as the lead administrator of the site adopted the username Dread Pirate Roberts.","note":""}],"notes":"PGP key recovery: App. 15a."},{"id":"D007","date":"2012-02-17","end":"","prec":"approx","thread":"rogue","key":true,"text":"Complaint states DEA SA Carl Force began working on the Silk Road investigation (Baltimore task force) on or about this date, and was using PGP as \"Nob\" by about April 2012.","actors":"Carl Mark Force IV (DEA)","cites":[{"src":"s6","loc":"p. 39 (Aff. p. 38); p. 23 n.14","quote":"On or about February 17, 2012, FORCE began working on the Silk Road investigation.","note":""},{"src":"s15","loc":"p. 61 (Br. 44)","quote":"Nor was Force’s investigation into Silk Road transitory or superficial in any respect. It began in February 2012,","note":""}],"notes":"p.23 n.14 says \"approximately February 2012\". OCR text (the .ocr.txt has no form-feeds; pinpoint is PDF page from per-page OCR); verify quote against PDF. Gov Nov 21, 2014 letter: \"In 2012 and 2013, SA Force was involved as an undercover agent\" in the D. Md. investigation (Br. 11)."},{"id":"D012","date":"2013-01-17","end":"","prec":"exact","thread":"rogue","key":true,"text":"Complaint: Force and Bridges were part of the team that arrested Curtis Green (\"C.G.\"/\"Flush\") in a controlled delivery of a kilogram of cocaine; Green turned over his Silk Road admin, Mt. Gox and Dwolla credentials and consented to use of the \"Flush\" identity.","actors":"Carl Force; Shaun Bridges; Curtis Green","cites":[{"src":"s6","loc":"p. 42 (Aff. p. 41)","quote":"On or about January 17, 2013, FORCE and BRIDGES were part of a team that apprehended C.G. ina controlled delivery for a kilogram of cocaine.","note":""},{"src":"s39","loc":"p. 3 (Gov. 11/21/2014 sealed ltr p. 3)","quote":"Green was arrested by SA Force and several other agents involved in the USAO-Baltimore investigation on January 17, 2013.","note":""}],"notes":"Green named only as \"C.G.\" in complaint; identified as Curtis Green in SDNY filings. Footnote: DPR cut off Flush access, regained 2013-01-20. OCR text (the .ocr.txt has no form-feeds; pinpoint is PDF page from per-page OCR); verify quote against PDF. Same date in Gov 12/18/2014 letter (p.56) and Court 12/22/2014 sealed opinion (p.77)."},{"id":"D015","date":"2013-01-25","end":"","prec":"exact","thread":"rogue","key":true,"text":"Bridges admitted that on or about this date he used another person's Silk Road administrator account to reset passwords/PINs and move ~20,000 Bitcoin (~$350,000) from vendor accounts into a wallet he controlled.","actors":"Shaun W. Bridges (USSS)","cites":[{"src":"s10","loc":"p. 11, Tr. 11:2-13; Tr. 16:1-17:2","quote":"move approximately 20,000 Bitcoins from various 11 Silk Road vendor accounts into a wallet, which he exercised 12 control","note":""},{"src":"s6","loc":"p. 43-44 (Aff. p. 42-43)","quote":"On January 25, 2013, during the afternoon and into the night, the Silk Road website suffered a series of sizeable thefts.","note":""},{"src":"s1","loc":"p. 11 (App. 9a)","quote":"in January 2013, Bridges used the Flush username to change other users’ passwords, empty their Bitcoin wallets,7 and keep $350,000 in Bitcoins in offshore bank accounts","note":""},{"src":"s15","loc":"p. 48 (Br. 31)","quote":"“[i]n late January 2013, members of the Baltimore Silk Road Task Force, to include BRIDGES and FORCE, gained access to a Silk Road administrator account","note":""}],"notes":"Plea factual basis (Aug. 31, 2015). Contrasts with SDNY sealed filings attributing the theft suspicion to Force/Green (230.1 p.3-4). SDNY sealed letters date the theft report 2013-01-26. Bridges reportedly left the proffer early. OCR text (the .ocr.txt has no form-feeds; pinpoint is PDF page from per-page OCR); verify quote against PDF. The \"7\" after wallets is a footnote marker in the source. Conflict: the gov Nov 21, 2014 pretrial disclosure attributed this $350,000 theft to Force; the complaint attributes it to Bridges (App. 9a n.8)."},{"id":"D024","date":"2013-01-29","end":"","prec":"exact","thread":"rogue","key":true,"text":"TorChat log: \"Nob\" quoted $80,000 for the killing of Green and DPR agreed to proceed; Force later staged Green's death and DPR paid $80,000 (documented in Force's reports).","actors":"Nob (SA Force); DPR/Ulbricht","cites":[{"src":"s39","loc":"p. 51 (Ex. A); p. 4","quote":"(2013-01-29 12:48) Nob: my guy got back to me at quoted 80K for the hit","note":""},{"src":"s18","loc":"p. 4","quote":"On January 26, 2013, CC-1 informed Ulbricht that he had determined that the Employee was responsible for the theft of bitcoins from various vendor accounts.","note":""}],"notes":"Staging and $80,000 payment described in Gov 11/21/2014 letter p.4; no date given there for the staging. 2d Cir identifies this as the \"Flush\" (Curtis Green) hit: DPR paid Nob (Force) $80,000 and Force faked the murder; charged separately in D. Md. No. 13-0222-CCB (App. 17a n.15). Conflict: 2d Cir says gov did not present the Flush murder-for-hire at trial, while ECF 142 (pretrial) granted gov leave to offer it."},{"id":"A026","date":"2013-03-31","end":"","prec":"exact","thread":"market","key":true,"text":"Government alleged DPR and redandwhite agreed on 1,670 bitcoins (about $150,000) for the murder of FriendlyChemist and DPR sent payment.","actors":"DPR; redandwhite","cites":[{"src":"s18","loc":"p. 7","quote":"Through further messages exchanged on March 31, 2013, DPR and redandwhite agreed upon a price of 1,670 bitcoins (approximately $150,000) for the murder-for-hire.","note":""},{"src":"s32","loc":"pp. 42-44, Tr. 1884:22-1886:2","quote":"The exchange rate is above 90 right now, so at $90/btc, $150k is about 1670 btc.","note":""}],"notes":"Laptop log entries: Mar 28 \"being blackmailed\", Mar 29 \"commissioned hit\" (ECF 142 p.8). GX 630 (blockchain). In the same exchange DPR wrote \"Not long ago, I had a clean hit done for $80k\" (Tr. 1883:12-13) and \"I've only ever commissioned the one other hit\" (Tr. 1884:19-20). Stipulation GX 805 states Canadian authorities have no record of a homicide in White Rock on or about March 31, 2013 (Tr. 1908:23-1909:4)."},{"id":"D029","date":"2013-04-01","end":"","prec":"approx","thread":"rogue","key":true,"text":"A Silk Road user \"DeathFromAbove\" began messaging DPR accusing him of Curtis Green's disappearance and death; on 2013-04-16 it named Anand Athavale as DPR and demanded $250,000.","actors":"DeathFromAbove (later attributed to Force); DPR","cites":[{"src":"s39","loc":"p. 108 (Gov. 2/1/2015 sealed ltr p. 2)","quote":"it started on or about April 1, 2013, when “DeathFromAbove” started making accusations that the “Dread Pirate Roberts” was responsible for the disappearance and death of Curtis Green","note":""},{"src":"s6","loc":"p. 25-26 (Aff. p. 24-25)","quote":"On or about April 1, 2013, FORCE created a fictitious persona on the Silk Road website named “Death from Above.”","note":""},{"src":"s1","loc":"p. 13 (App. 11a)","quote":"in one such chat that took place on April 16, 2013, DeathFromAbove told DPR that he knew that DPR’s true identity was Anand Athavale.","note":""}],"notes":"NSA-1 complaint dates the itemized-ID message 2013-04-10 rather than 04-16 (see complaint rows). Complaint ties persona to Force via screen-recording video in his DEA case file (Ex. A). OCR text (the .ocr.txt has no form-feeds; pinpoint is PDF page from per-page OCR); verify quote against PDF. Gov revealed DeathFromAbove = Force only in a Feb 1, 2015 letter (Br. 29)."},{"id":"A035","date":"2013-06","end":"","prec":"approx","thread":"investigation","key":true,"text":"Former FBI SA Christopher Tarbell declared that in early June 2013 he and another CY-2 agent found the SR Server's true IP leaking from the Silk Road login/CAPTCHA interface.","actors":"Christopher Tarbell; FBI CY-2 squad (NY)","cites":[{"src":"s49","loc":"p. 3 ¶7","quote":"In or about early June 2013, another member of CY-2 and I closely examined the traffic data being sent from the Silk Road website","note":""}],"notes":"Contested: defense (Horowitz Decl., ECF 70) called this \"implausible\" given Nginx config. Gov: no other contemporaneous records exist (ECF 70-4 p.4). Gov denied NSA involvement (ECF 75 p.5-6)."},{"id":"A040","date":"2013-07-10","end":"","prec":"exact","thread":"market","key":true,"text":"U.S. Customs and Border Protection intercepted a package from Canada containing nine counterfeit IDs, all bearing a photo alleged to be Ulbricht's.","actors":"CBP","cites":[{"src":"s18","loc":"p. 12","quote":"On July 10, 2013—the same day that shefoundme’s package was “inbound out of customs”—federal agents with U.S. Customs and Border Protection (“CPB”) intercepted a package from Canada","note":""},{"src":"s31","loc":"pp. 152-155, Tr. 1468:25-1471:23","quote":"Q. So when, approximately, were these IDs seized by CBP? A. Approximately in the neighborhood of July 10th of 2013.","note":""}],"notes":"Jurisdictions listed slightly differently in ECF 108 p.4 (Alberta, New South Wales). GX 400-402. DOB 3/27/1984 on all nine (Tr. 1470:18-23). Matches Silk Road messages in which buyer \"shefoundme\" ordered IDs from \"KingOfClubs\" (Doc 212, Tr. 1794:14-1802:6)."},{"id":"A043","date":"2013-07-23","end":"","prec":"exact","thread":"investigation","key":true,"text":"After obtaining an Icelandic court order, the Reykjavik Metropolitan Police covertly imaged the SR Server; Tarbell stated the FBI only consulted on timing.","actors":"Reykjavik Metropolitan Police; FBI","cites":[{"src":"s49","loc":"p. 6 ¶12","quote":"After obtaining the necessary court order under Icelandic law, the RMP imaged the Subject Server on July 23, 2013.","note":""},{"src":"s26","loc":"p. 113; Tr. 695:17-695:19","quote":"the U.S. government, got access to the Silk Road servers no later than July 23, 2013, right? A. The FBI did.","note":""},{"src":"s30","loc":"p. 179, Tr. 1740:19-21","quote":"The government had access to the servers -- the U.S. government had access to the servers in July of 2013, correct? A. That's what I've been told","note":""}],"notes":"Horowitz: orange21.tar.gz mtime July 23, 2013 matches; three other tarballs dated June 6, 2013 (ECF 70 p.16). RMP imaged by booting single-user mode and tar copying (ECF 70-4 p.7). Witness lacked personal knowledge of location (Tr. 697:7-698:6). Defense summation relied on this, arguing the government let the site run from July to the end of September 2013 (Doc 218, Tr. 2209:4-8). Yum said he received the server IP from the investigative team and could not speak to how it was found (Tr. 1740:5-9)."},{"id":"B054","date":"2013-07-26","end":"","prec":"approx","thread":"investigation","key":true,"text":"Der-Yeghiayan took over the Silk Road staff account 'cirrus' (consent of prior operator) and began working as an undercover moderator paid by DPR.","actors":"HSI SA Jared Der-Yeghiayan","cites":[{"src":"s24","loc":"p. 146; Tr. 266:22-266:24","quote":"Approximately July 26, 27th of 2013.","note":""}],"notes":"Elsewhere 'late July 2013' (Tr. 265:18). He was not cirrus on July 23 but was by Aug 2 (202 Tr. 630:7-12)."},{"id":"B061","date":"2013-09-10","end":"","prec":"approx","thread":"investigation","key":true,"text":"IRS SA Gary Alford (NY OCDETF) brought Ross Ulbricht to Der-Yeghiayan's attention; the focus shifted to Ulbricht.","actors":"HSI SA Jared Der-Yeghiayan; IRS SA Gary Alford","cites":[{"src":"s24","loc":"p. 192; Tr. 312:10-312:16","quote":"It was approximately around September 10th, September 11th, 2013.","note":""}],"notes":"He had never heard of Ulbricht before (Tr. 312:8-9; 200 Tr. 460:1-3)."},{"id":"D046","date":"2013-09-15","end":"","prec":"exact","thread":"rogue","key":true,"text":"DPR paid 770 BTC (~$98,000) to \"French Maid\"; via pass-through addresses the coins reached Force's personal CampBX account between Sept. 23 and 29, 2013.","actors":"DPR; Carl Force","cites":[{"src":"s6","loc":"p. 24 (Aff. p. 23)","quote":"Silk Road server data reveals that DPR made a payment on September 15, 2013, for 770 bitcoins.","note":""}],"notes":"At least 600 BTC moved from CampBX to Force's Bitstamp account in Nov. 2013. OCR text (the .ocr.txt has no form-feeds; pinpoint is PDF page from per-page OCR); verify quote against PDF."},{"id":"A052","date":"2013-09-17","end":"","prec":"range","thread":"investigation","key":true,"text":"FBI obtained several pen registers on Ulbricht's home ISP account, Wi-Fi router, and devices to match his online times with DPR's Silk Road activity; no content or GPS data was collected.","actors":"FBI; SDNY magistrate judges","cites":[{"src":"s49","loc":"p. 8 ¶19","quote":"During the period from September 17 to September 20, 2013, the FBI obtained several judicially authorized pen registers for the purpose of confirming the identity of Ulbricht as “DPR”","note":""},{"src":"s54","loc":"p. 4","quote":"Pen-Trap Order No. 1: To Comcast re IP address 67.170.232.207 (9/16/13);","note":""},{"src":"s54","loc":"p. 4","quote":"Pen-Trap Order No. 4: Re certain computer devices associated with MAC addresses including 88-53-2E-9C-81-96, (9/20/13); and","note":""}],"notes":"Range end 2013-09-20. Five pen-trap orders total (ECF 89 p.4-5; App. 7a). Defense argued they tracked his location; Tarbell denied (¶21). Conflict: Tarbell says the pen registers were obtained September 17-20, 2013 (ECF 57 ¶19). ECF 89 dates Order No. 2 (Comcast) 9/19/2013; defense memo dates the second Comcast order September 17, 2013 (ECF 48 p.19). Same text in ulbrichtchargesstand.txt. MAC 88-53-2E-9C-81-96 matches the Samsung laptop in Warrant No. 6."},{"id":"A056","date":"2013-09-27","end":"","prec":"exact","thread":"takedown","key":true,"text":"Ulbricht charged by sealed complaint (S.D.N.Y.) with narcotics-trafficking conspiracy, computer-hacking conspiracy, and money-laundering conspiracy.","actors":"USAO-SDNY; Ulbricht","cites":[{"src":"s45","loc":"p. 8","quote":"On September 27, 2013, Ulbricht was charged by complaint (the “Complaint”) with one count of conspiring to commit narcotics trafficking","note":""},{"src":"s26","loc":"p. 124; Tr. 706:13-706:15","quote":"this is sworn under oath September 27, 2013 for the purpose of obtaining an arrest warrant against Mr. Ulbricht","note":""},{"src":"s31","loc":"p. 114, Tr. 1427:12-13","quote":"on or about September 27th, 2013, the Honorable Frank Maas signed this criminal complaint","note":""}],"notes":"Gov noted Ulbricht was separately charged in D. Md. for one attempted murder for hire (ECF 26 p.9 n.1). Counsel's statement at sidebar. Der-Yeghiayan: FBI obtained arrest warrant 'sometime late September 2013' (198 Tr. 313:15-19). 614,305 BTC: 204 Tr. 834:21-835:6. Counsel's description, not testimony."},{"id":"A059","date":"2013-10-01","end":"","prec":"exact","thread":"takedown","key":true,"text":"Ulbricht arrested in a San Francisco public library while logged in as DPR, after Der-Yeghiayan (undercover as admin \"Cirrus\") started a staff chat to get him onto the Silk Road site.","actors":"Ulbricht; Jared Der-Yeghiayan (HSI); FBI","cites":[{"src":"s1","loc":"p. 14 (App. 12a)","quote":"Ulbricht was arrested in a San Francisco public library on October 1, 2013","note":""},{"src":"s28","loc":"pp. 26-27, Tr. 1036:22-1037:17","quote":"Q. What would have happened if the defendant had closed his laptop before the FBI seized it? A. It would have went into an encrypted state.","note":""},{"src":"s33","loc":"pp. 98-99, Tr. 2161:8-2162:24","quote":"after the defendant enters the library at 3:08 p.m. DPR shows up on staff chat.","note":""},{"src":"s27","loc":"p. 68; Tr. 847:4-847:12","quote":"The initial arrest was going to be on October 2nd, which is at his residence","note":""}],"notes":"Laptop was seized incident to arrest with the Cirrus chat open and the DPR-only \"Mastermind\" page in use (App. 12a). Library location at Tr. 1037:25-1038:3 (GX 128H). On cross, Kiernan acknowledged telling prosecutors twice that Ulbricht sat with his back to him looking out the window (Tr. 1038:19-1039:8; 3508-2, 3508-7), which conflicts with the seat shown in the photo. Doc 208 is the docketed \"corrected\" 1/22/2015 transcript; original Doc 206 has same text at pp.26-27, Tr. 1056:23-1057:18. Summation characterizes Der-Yeghiayan testimony given on earlier trial days (not in this file set); chat timestamps were UTC (+7). Turner said Der-Yeghiayan took over the cirrus account \"back in July\" (Tr. 2162:15-17). Turner also said the arrest notes in the trash matched DPR forum posts of August 11 and September 12 (Tr. 2163:15-23). Der-Yeghiayan describes plan to chat with DPR while defendant in public (198 Tr. 313:22-315:5)."},{"id":"A060","date":"2013-10-01","end":"","prec":"exact","thread":"takedown","key":true,"text":"Ulbricht's laptop, seized at arrest, held Bitcoin wallets with over 144,000 Bitcoins worth $16-18 million then; analysis traced nearly 90% to wallets on Silk Road servers.","actors":"Ulbricht; government","cites":[{"src":"s44","loc":"p. 5","quote":"There were also Bitcoin wallets on the laptop containing over 144,000 Bitcoins, valued at the time of Ulbricht’s arrest at $16-18 million.","note":""},{"src":"s26","loc":"p. 109; Tr. 691:4-691:8","quote":"the 144,000 bitcoins that were seized from Mr. Ulbricht's laptop, right? A. Yes.","note":""},{"src":"s30","loc":"pp. 112-113, Tr. 1673:25-1674:12","quote":"A. It was approximately 144,000 bitcoins. ... it would have been anywhere between 16- to $18 million.","note":""}],"notes":"Date is the arrest/seizure date; actual seizure/forfeiture transfer date not stated. 2d Cir: \"approximately $18 million\" seized, \"about 89%\" from Silk Road servers in Iceland (App. 15a). Seizure date not stated. Contrast government opening '$18 million' (196 Tr. 47:12, 55:14-16). The transfer date is not stated in this transcript; Yum said only that it came after the arrest (\"prior to when I received that wallet file\"). Kiernan's hand-off of wallet.dat to Yum: Doc 208, Tr. 1033:6-8."},{"id":"A061","date":"2013-10-02","end":"","prec":"exact","thread":"takedown","key":true,"text":"Silk Road website taken down the day after the arrest; Icelandic police seized and re-imaged the SR Server with FBI personnel present.","actors":"FBI; Reykjavik Metropolitan Police","cites":[{"src":"s49","loc":"p. 7 ¶14","quote":"the arrest of Ulbricht and the takedown of the Silk Road website, which occurred on October 1 and 2, 2013, respectively","note":""},{"src":"s25","loc":"p. 74; Tr. 420:15-420:25","quote":"October 2nd, around -- I think like around 10 a.m., I want to say, 11.","note":""},{"src":"s30","loc":"p. 85, Tr. 1646:10-20","quote":"wait for the team that's on-ground in San Francisco, the FBI arrest team, and wait for them to give me a confirmation that the defendant has been arrested.","note":""},{"src":"s6","loc":"p. 11 (Aff. p. 10)","quote":"The Silk Road website was established in early 2011 and operated until on or about October 2, 2013, when it was seized by law enforcement.","note":""}],"notes":"Tarbell n.8: request asked to let FBI post a seizure banner; seizure/re-imaging performed solely by RMP. Also 196 Tr. 97:12-13. He took one of two mirrored drives from the market server and kept the site running to drain the bitcoin server (Tr. 1647:22-1650:22). Shaw's cross put the market-server image creation date at October 8, 2013 (Doc 216, Tr. 1976:7-23). Ulbricht arrested 2013-10-01 (same complaint p.12). OCR text (the .ocr.txt has no form-feeds; pinpoint is PDF page from per-page OCR); verify quote against PDF."},{"id":"A065","date":"2014-02-04","end":"","prec":"exact","thread":"court","key":true,"text":"Grand jury returned a four-count indictment: narcotics conspiracy, continuing criminal enterprise, computer-hacking conspiracy, and money-laundering conspiracy.","actors":"Grand jury (S.D.N.Y.); Ulbricht","cites":[{"src":"s46","loc":"p. 1","quote":"On February 4, 2014, a Grand Jury sitting in the Southern District of New York returned Indictment 14 Cr. 68","note":""}],"notes":""},{"id":"A068","date":"2014-05-04","end":"","prec":"exact","thread":"rogue","key":true,"text":"Force resigned from the DEA on May 4, 2014, and on May 8 wired $235,000 to an offshore account in Panama (per complaint, as cited by defense).","actors":"Carl Force","cites":[{"src":"s15","loc":"p. 50 (Br. 33)","quote":"Force resigned from the DEA May 4, 2014, “shortly after law enforcement began the current investigation.”","note":""},{"src":"s6","loc":"p. 8 (Aff. p. 7); p. 36; p. 47","quote":"FORCE resigned on May 4, 2014, shortly after law enforcement began the current investigation.","note":""},{"src":"s6","loc":"p. 40 (Aff. p. 39)","quote":"On or about May 8, 2014, presumably after learning of the government’s investigation and after he had resigned, FORCE wired $235,000 to an offshore account in Panama.","note":""}],"notes":"Force interviewed May 30, 2014 (same page). p.47 says letter of resignation submitted \"By May 4, 2014\" effective later that month. OCR text (the .ocr.txt has no form-feeds; pinpoint is PDF page from per-page OCR); verify quote against PDF. OCR text (the .ocr.txt has no form-feeds; pinpoint is PDF page from per-page OCR); verify quote against PDF."},{"id":"A071","date":"2014-08-21","end":"","prec":"exact","thread":"court","key":true,"text":"Superseding Indictment S1 filed with seven counts, adding narcotics distribution, distribution by Internet, and fraudulent-ID conspiracy, plus aiding-and-abetting language.","actors":"USAO-SDNY; grand jury","cites":[{"src":"s55","loc":"p. 2","quote":"The Superseding Indictment, filed on August 21, 2014, charges Ulbricht with seven crimes","note":""}],"notes":"Count Three also alleged payments of ~$150,000 and ~$500,000 for murders (p.2-3)."},{"id":"A080","date":"2014-10-10","end":"","prec":"exact","thread":"court","key":true,"text":"Court denied suppression, holding Ulbricht had no personal privacy interest to challenge the investigation that led to the Icelandic server, its imaging, or Warrant Nos. 1-5 and 7.","actors":"Judge Forrest","cites":[{"src":"s54","loc":"p. 26","quote":"Ulbricht therefore has no basis to challenge as violations of his Fourth Amendment rights: (1) the investigation that preceded and led to the Icelandic server,","note":""}],"notes":"Also held pen-trap info \"entirely appropriate\" (p.33). Opinion lists 14 warrants/orders (p.4). Same text in ulbrichtchargesstand.txt."},{"id":"A083","date":"2014-11-21","end":"","prec":"exact","thread":"court","key":true,"text":"Gov sent the court a sealed ex parte letter seeking leave to disclose the Force grand-jury investigation to the defense under a protective order.","actors":"USAO-SDNY; Judge Forrest","cites":[{"src":"s1","loc":"p. 52 (App. 50a)","quote":"on November 21, 2014, the government wrote a sealed ex parte letter to the district court seeking permission to disclose to the defense information about the Force grand jury investigation","note":""},{"src":"s39","loc":"p. 1-6","quote":"He is now being investigated by USAO-San Francisco for, among other things, leaking information about USAO- Baltimore’s investigation to Ulbricht in exchange for payment","note":""}],"notes":"Letter said Force was the undercover agent Ulbricht allegedly hired for the D. Md. murder-for-hire (Br. 24). Letter asserts Force \"played no role\" in SDNY investigation and info is not Brady. Bridges was not mentioned (Gov. ECF 230 p.12 n.1: he became a target later)."},{"id":"A091","date":"2015-01-13","end":"","prec":"exact","thread":"trial","key":true,"text":"Trial began in S.D.N.Y.; defense conceded in opening that Ulbricht created Silk Road but argued he left and was later framed.","actors":"Judge Forrest; Ulbricht; Joshua Dratel","cites":[{"src":"s1","loc":"p. 15 (App. 13a)","quote":"Ulbricht’s trial lasted approximately three weeks, from January 13 through February 4, 2015.","note":""},{"src":"s23","loc":"p. 28; Tr. 42:12-42:24","quote":"in 2009 began what he described as, quote, a secret project. Using his laptop computer, he created the Silk Road website.","note":""}],"notes":"One-week delay from Jan 5 due to a personal matter of a government attorney (ECF 237 p.2 n.1). Government opening; allegation, not evidence."},{"id":"A094","date":"2015-02-01","end":"","prec":"exact","thread":"trial","key":true,"text":"Shortly before resting, government disclosed by letter that the account \"DeathFromAbove\" appeared to be controlled by former SA Force.","actors":"USAO-SDNY","cites":[{"src":"s15","loc":"p. 46 (Br. 29)","quote":"it appears that “DeathFromAbove,” was controlled by former Special Agent Force","note":""},{"src":"s39","loc":"p. 110-111","quote":"the Government consulted with the lead Assistant U.S. Attorney handling the Force investigation, who provided evidence that Force controlled the “DeathFromAbove” account","note":""}],"notes":"Defense was barred from using the DeathFromAbove chats (App. 21a). Gov. ECF 230 p.16, 26 n.10: SDNY learned this only during trial. Exclusion: Tr. 1871-73 per ECF 230 p.16."},{"id":"A096","date":"2015-02-04","end":"","prec":"exact","thread":"trial","key":true,"text":"Jury convicted Ulbricht on all seven counts after about three and a half hours of deliberation.","actors":"Jury; Ulbricht","cites":[{"src":"s1","loc":"p. 25 (App. 23a)","quote":"After deliberating for about three and a half hours, the jury returned a guilty verdict on all seven counts in the Indictment.","note":""},{"src":"s34","loc":"pp. 84-87, Tr. 2334:3-2337:5","quote":"As to Count One, how do you find the defendant? Guilty.","note":""},{"src":"s44","loc":"p. 2","quote":"On February 4, 2015, after just a few hours of deliberation, the jury returned guilty verdicts on all counts.","note":""},{"src":"s34","loc":"p. 79, Tr. 2329:25","quote":"(At 11:55 a.m., the jury retired to deliberate)","note":""}],"notes":"Brief: deliberations began 11:55 a.m.; verdict note 3:23 p.m. (Br. 17). Special findings on Counts One-Three: heroin 1 kg+, cocaine 5 kg+, LSD 10 g+, methamphetamine 500 g+ (Tr. 2335:1-2336:13); the Count Two LSD line reads \"ten kilograms\" (Tr. 2335:23), likely a transcription error. Jury polled (Tr. 2337:9-2338:14). ECF 230 p.11 says three-and-a-half hours of deliberation. Session start time 10:06 a.m. (Tr. 2251:9). Counts listed at Tr. 2277:16-2278:7."},{"id":"A098","date":"2015-03-25","end":"","prec":"exact","thread":"rogue","key":true,"text":"Government filed a criminal complaint in N.D. Cal. against former DEA SA Carl Force and former Secret Service SA Shaun Bridges.","actors":"USAO-N.D. Cal.; Carl Force; Shaun Bridges","cites":[{"src":"s15","loc":"p. 35 (Br. 18)","quote":"on March 25, 2015, seven weeks after trial concluded in this case, the government filed criminal charges against Force and another participant in the Silk Road investigation","note":""},{"src":"s6","loc":"p. 1-3; p. 51","quote":"Sworn to before me and signed in my presence. Date: 03/25/2015","note":""}],"notes":"Bridges case: No. CR 15-319 (RS) (N.D. Cal.) (Br. 23). Complaint unsealed 2015-03-30 per SDNY letter (ECF 226). NSA-4 (Case3:15-mj-70370, Document 3 filed 03/25/15) is image-only; its OCR was not available. OCR text (the .ocr.txt has no form-feeds; pinpoint is PDF page from per-page OCR); verify quote against PDF."},{"id":"A100","date":"2015-04-27","end":"","prec":"exact","thread":"after","key":true,"text":"Court denied the Rule 33 motion, finding the Force/Bridges material and late 3500 production not Brady and ","prec":"exact","thread":"rogue","key":true,"text":"Bridges pleaded guilty before Judge Richard Seeborg (N.D. Cal., CR 15-319 RS) to money laundering (18 U.S.C. 1957) and obstruction of justice (18 U.S.C. 1512(c)(2)); sentencing set for Dec. 7, 2015.","actors":"Shaun W. Bridges; Judge Richard Seeborg; AUSAs Haun, Frentzen; PIN Trial Atty Evans","cites":[{"src":"s10","loc":"p. 23, Tr. 23:7-17; Tr. 24-25","quote":"how do you plead, Mr. Bridges? Guilty or not 11 guilty? 12 THE DEFENDANT: Guilty.","note":""}],"notes":"Cover page says \"Wednesday August 31, 2015\" but Tr. 3:1 says \"MONDAY\"; 8/31/2015 was a Monday. AUSA Haun referenced an earlier \"Force entry of plea\" (Tr. 3:24-25) without date. Govt raised Bridges' attempts to change name/SSN; court added conditions, no remand."},{"id":"A107","date":"2017-05-31","end":"","prec":"exact","thread":"after","key":true,"text":"Second Circuit (Lynch, J.) affirmed the conviction and life sentence in all respects.","actors":"U.S. Court of Appeals for the Second Circuit","cites":[{"src":"s1","loc":"p. 6 (App. 4a)","quote":"Because we identify no reversible error, we AFFIRM Ulbricht’s conviction and sentence in all respects.","note":""},{"src":"s56","loc":"line 348 (ECF 296)","quote":"Ordered, Adjudged and Decreed that the judgment of the District Court is AFFIRMED.","note":""}],"notes":"Decided May 31, 2017 (App. 3a). Mandate date; opinion date not given in index line."},{"id":"D114","date":"2025-01-21","end":"","prec":"exact","thread":"after","key":true,"text":"Executive grant of clemency: the President granted Ulbricht a full and unconditional pardon.","actors":"President of the United States; Ulbricht","cites":[{"src":"s56","loc":"line 474 (ECF 403)","quote":"The President of the U. S. grants a full and unconditional pardon to the defendant.","note":""}],"notes":"Docket entry entered 1/28/2025."}]}],"maps":[],"sections":[{"id":"overview","title":"Overview","desc":""},{"id":"money","title":"The money","desc":"Bitcoin amounts and the forfeiture judgment."},{"id":"record","title":"The record","desc":"Activity on the district-court docket."}],"panels":[{"id":"p1","section":"overview","type":"stat","title":"Recorded sales on Silk Road","sub":"6 Feb 2011 – 2 Oct 2013, from the server database","span":2,"width":1,"dataset":"","cfg":{"mode":"manual","value":"$213.9M"},"cites":[{"src":"s32","loc":"p. 84, Tr. 1926:2-7","quote":"for a total U.S. dollar amount recorded in the database of $213,888,103 U.S. dollars.","note":""}],"note":"","tall":false},{"id":"p2","section":"overview","type":"stat","title":"Transactions","sub":"Same period and database","span":2,"width":1,"dataset":"","cfg":{"mode":"manual","value":"1,530,252"},"cites":[{"src":"s32","loc":"p. 84, Tr. 1926:2-7","quote":"You see we have 1,530,252 total transactions","note":""}],"note":"","tall":false},{"id":"p3","section":"overview","type":"stat","title":"Commissions to the operator","sub":"About $13.2 million at recorded values","span":2,"width":1,"dataset":"","cfg":{"mode":"manual","value":"642,455 BTC"},"cites":[{"src":"s32","loc":"p. 84, Tr. 1926:2-7","quote":"The commission value in bitcoins here is 642,455.36 bitcoins, and the recorded value in U.S. dollars for the commission was 13,174,896 U.S. dollars.","note":""},{"src":"s57","loc":"p. 4","quote":"The Complaint states that, from February 6, 2011 to July 23, 2013, Silk Road generated revenue totaling 9,519,664 Bitcoins and commissions totaling 614,305 Bitcoins.","note":""}],"note":"The criminal complaint gave 614,305 BTC in commissions. The government said the two figures cover different periods: the complaint stops at July 23, 2013, the trial figure at October 2013.","tall":false},{"id":"p5","section":"overview","type":"map","title":"Where it happened","sub":"Investigation, seizures and arrests, and the courts","span":4,"width":2,"dataset":"d4","cfg":{"lat":"lat","lon":"lon","label":"place","color":"kind","base":"auto","labels":"always"},"cites":[],"note":"","tall":true},{"i   }
  function coverHTML(m) {
    var cv = m.cover; if (!cv || !cv.img || cv.pos === 'none') return { cls: '', pre: '', bg: '', side: '' };
    var img = '<img src="' + esc(mres(cv.img)) + '" alt="' + esc(cv.alt) + '" decoding="async" referrerpolicy="no-referrer">', cap = cv.cap ? '<figcaption>' + inline(esc(cv.cap)) + '</figcaption>' : '';
    if (cv.pos === 'above') return { cls: '', pre: '<figure class="cover cover-above ch-' + cv.height + '">' + img + cap + '</figure>', bg: '', side: '' };
    if (cv.pos === 'side') return { cls: ' has-side', pre: '', bg: '', side: '<figure class="cover cover-side ch-' + cv.height + '">' + img + cap + '</figure>' };
    return { cls: ' has-bg ch-' + cv.height, pre: '', bg: '<div class="cover-bg" aria-hidden="' + (cv.alt ? 'false' : 'true') + '">' + img + '</div>' + (cv.cap ? '<div class="cover-cap">' + inline(esc(cv.cap)) + '</div>' : ''), side: '' };
  }
  document.addEventListener('input', function (ev) { var t = ev.target; if (ui.mode !== 'edit' || ui.etab !== 'page') return; var cv = P.meta.cover; if (t.id === 'cvSrc') { var ok = DB.mediaSrc(t.value, ''); t.classList.toggle('bad', !!t.value.trim() && !ok); cv.img = ok; if (cv.img && cv.pos === 'none') cv.pos = 'above'; touch(); headPreview(); } else if (t.dataset && t.dataset.cvf && t.tagName === 'INPUT') { cv[t.dataset.cvf] = t.value; touch(); headPreview(); } });
  document.addEventListener('change', function (ev) { var t = ev.target; if (ui.mode !== 'edit' || ui.etab !== 'page') return; var cv = P.meta.cover; if (t.dataset && t.dataset.cvf && t.tagName === 'SELECT') { cv[t.dataset.cvf] = t.value; touch(); headPreview(); } if (t.id === 'cvSrc') edPage(); if (t.id === 'cvIn' && t.files[0]) { readPicture(t.files[0], function (url) { cv.img = url; if (cv.pos === 'none') cv.pos = 'above'; touch(); edPage(); }); t.value = ''; } });
  document.addEventListener('click', function (ev) { if (ui.mode !== 'edit' || ui.etab !== 'page') return; var t = ev.target; if (t.id === 'cvUp') $('cvIn').click(); if (t.id === 'cvDel') { P.meta.cover = DB.blankCover(); touch(); edPage(); } });
  function headHTML(m, y, counts, inEditor) {
    var cv = coverHTML(m);
    var inner = (m.eyebrow ? '<div class="eyebrow">' + esc(m.eyebrow) + '</div>' : '') + '<h1 class="v-title">' + esc(m.title) + '</h1>' + (m.dek ? '<div class="dek">' + md(m.dek) + '</div>' : '') + '<div class="meta">' + counts + (m.byline ? '<span>' + esc(m.byline) + '</span>' : '') + (m.compiled ? '<span>Compiled ' + esc(DB.showDate(DB.normDate(m.compiled)) || m.compiled) + '</span>' : '') + '</div>';
    return cv.pre + '<header class="v-head' + cv.cls + '"' + (inEditor ? ' style="padding-block:14px 6px"' : '') + '>' + cv.bg + (cv.side ? '<div class="vh-text">' + inner + '</div>' + cv.side : '<div class="vh-text">' + inner + '</div>') + '</header>';
  }
  function headPreview() {
    var h = $('hprev'); if (!h) return; var m = P.meta;
    applyStyle(h); h.classList.add('hprev');
    h.innerHTML = '<div class="wrap">' + headHTML(m, P.style, P.style.stats ? '<span><b>' + P.panels.length + '</b> panels</span>' : '', true) +
      (P.sections.length > 1 ? '<nav class="stabs" style="position:static">' + P.sections.slice(0, 4).map(function (s, i) { return '<button aria-selected="' + (i === 0) + '" tabindex="-1">' + esc(s.title) + '</button>'; }).join('') + '</nav>' : '') + '</div>';
  }
  document.addEventListener('input', function (ev) { var k = ev.target.dataset && ev.target.dataset.mf; if (k) { P.meta[k] = ev.target.value; touch(); headPreview(); } if (ev.target.id === 'accPick') { P.style.accent = DB.hex(ev.target.value); touch(); headPreview(); document.querySelectorAll('.accsw').forEach(function (b) { b.setAttribute('aria-pressed', 'false'); }); } });
  document.addEventListener('change', function (ev) { var t = ev.target; if (t.dataset && t.dataset.yf) { P.style[t.dataset.yf] = t.value; touch(); headPreview(); } if (t.id === 'yStats') { P.style.stats = t.checked; touch(); headPreview(); } });
  document.addEventListener('click', function (ev) { var b = ev.target.closest && ev.target.closest('[data-acc]'); if (!b || ui.etab !== 'page' || ui.mode !== 'edit') return; P.style.accent = DB.hex(b.getAttribute('data-acc')); touch(); document.querySelectorAll('.accsw').forEach(function (z) { z.setAttribute('aria-pressed', z === b); }); headPreview(); });

  // --- check ---
  function edAudit() {
    var a = DB.audit(P, O, TYPES, TEXT_KEYS), fix = a.rows.filter(function (r) { return r.level === 'fix'; }).length;
    $('epane').innerHTML = '<div class="form" style="margin-block:16px 60px"><h2>Check the dashboard</h2><p class="hint">' + P.panels.length + ' panels, ' + P.datasets.length + ' data sets, ' + P.timelines.length + ' timelines, ' + P.sources.length + ' sources. ' + (a.rows.length ? fix + ' to fix, ' + (a.rows.length - fix) + ' to check.' : '<span class="ok">Nothing to fix.</span>') + (a.unrated ? ' ' + a.unrated + ' source' + (a.unrated > 1 ? 's are' : ' is') + ' unrated; ratings are optional but expected on any source a reader might question.' : '') + '</p>' +
      '<div class="audit">' + a.rows.slice(0, 400).map(function (r) { var go = panelOf(r.where) ? 'data-gop' : dataOf(r.where) || tlOf(r.where) ? 'data-god' : sourceOf(r.where) ? 'data-gos' : ''; return '<div class="item ' + r.level + '"><span class="lvl">' + r.level + '</span><span>' + esc(r.msg) + '</span>' + (go ? '<button class="btn small" ' + go + '="' + esc(r.where) + '">Open</button>' : '<span></span>') + '</div>'; }).join('') + '</div></div>';
  }
  document.addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-gop],[data-god],[data-gos]'); if (!b) return;
    if (b.hasAttribute('data-gop')) { ui.pid = b.getAttribute('data-gop'); ui.etab = 'panels'; }
    else if (b.hasAttribute('data-god')) { ui.did = b.getAttribute('data-god'); ui.etab = 'data'; }
    else { ui.sid = b.getAttribute('data-gos'); ui.etab = 'sources'; }
    renderEdit();
  });

  // ---------- top level ----------
  function render() {
    document.title = P.meta.title + (PUBLISHED ? '' : ' · OSINT Dashboard Builder');
    renderBar(); $('view').hidden = ui.mode !== 'view'; $('edit').hidden = ui.mode !== 'edit';
    if (ui.mode === 'view') renderView(); else renderEdit();
  }
  window.addEventListener('beforeunload', function (e) { if (!PUBLISHED && fileDirty && !savedAt) { e.preventDefault(); e.returnValue = ''; } });
  document.addEventListener('dragover', function (e) { if (!PUBLISHED) e.preventDefault(); });
  document.addEventListener('drop', function (e) { if (PUBLISHED) return; e.preventDefault(); var f = e.dataTransfer.files[0]; if (!f) return; var r = new FileReader(); r.onload = function () { openText(f.name, String(r.result)); }; r.readAsText(f); });
  render();
  if (/^#[\w.-]+$/.test(location.hash) && panelOf(location.hash.slice(1))) setTimeout(function () { jumpPanel(location.hash.slice(1)); }, 150);
})();
</script>
</body>
